@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/poppins-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* ---------- Tokens ------------------------------------------------------ */
:root{
  /* superfícies */
  --bg:#F6F9F8;
  --surface:#FFFFFF;
  --border:#E4EAE7;
  --border-strong:#D3DCD8;

  /* texto */
  --text:#0F1B17;
  --muted:#6B7A75;
  --faint:#9AA8A3;

  /* acento */
  --accent:#12B76A;
  --accent-dark:#0E9553;
  --accent-soft:#E9FBF2;
  --accent-ring:rgba(18,183,106,.20);

  /* extremos do gradiente do gráfico de projeção */
  --danger:#F04438;
  --warn:#F79009;

  --track:#E4EAE7;

  /* forma */
  --r-card:16px;
  --r-btn:14px;
  --r-pill:999px;

  /* profundidade */
  --shadow-sm:0 1px 2px rgba(15,27,23,.05);
  --shadow-md:0 4px 16px rgba(15,27,23,.07);
  --shadow-cta:0 5px 14px rgba(18,183,106,.26);

  /* movimento */
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);

  /* tipografia fluida — calibrada para 320px … 430px */
  --fs-title:clamp(19px,5.4vw,24px);
  --fs-title-lg:clamp(21px,6vw,27px);
  --fs-sub:clamp(13.5px,3.7vw,15px);
  --fs-option:clamp(14.5px,4vw,16px);
  --fs-option-sub:clamp(12px,3.3vw,13px);

  /* alvo mínimo de toque */
  --tap:48px;

  /* margens seguras do aparelho (notch, barra inferior) */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* altura da barra de ação fixa — o app.js remede a cada etapa,
     porque a projeção usa dois botões e o primário quebra em duas linhas */
  --bar-h:88px;
}

/* ---------- Base -------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;   /* impede o iOS de reescalar o texto na rotação */
  overscroll-behavior-y:none;      /* mata o "puxar para atualizar", que zeraria o quiz */
}

body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;   /* sem flash cinza ao tocar */
}

img{max-width:100%;height:auto;display:block}
p{margin:0}

/* O `hidden` do HTML é regra do navegador, e QUALQUER `display` de autor a
   vence — não por especificidade, mas por ordem de origem na cascata. O
   `img{display:block}` da linha acima já bastava para anular o hidden das
   imagens: o cartão de preço da oferta aparecia junto com o vídeo, antes do
   pitch, enquanto título e botão continuavam escondidos.

   É o mecanismo que sustenta o reveal do funil inteiro (revealAtVideoTime),
   então o !important aqui não é preguiça: é devolver ao atributo a palavra
   final que ele deveria ter. */
[hidden]{display:none !important}

/* Todo elemento tocável: sem zoom de duplo-toque, sem seleção acidental */
button,a,.option,.units button{
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

#app{
  display:flex;justify-content:center;
  min-height:100dvh;
  padding:calc(12px + var(--safe-t)) calc(16px + var(--safe-r))
          calc(24px + var(--safe-b)) calc(16px + var(--safe-l));
  transition:padding-bottom .2s;
}
/* Abre espaço para a barra de ação fixa não cobrir o conteúdo */
body.has-bar #app{padding-bottom:calc(var(--bar-h) + var(--safe-b) + 12px)}

.shell{width:100%;max-width:440px}

/* Transição de entrada de cada etapa */
.shell.step-in{animation:stepIn .36s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Cabeçalho --------------------------------------------------- */
.header{display:flex;align-items:center;gap:10px;min-height:var(--tap);margin-bottom:12px}
.header__back{
  width:var(--tap);height:var(--tap);flex:0 0 var(--tap);
  display:grid;place-items:center;
  color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-pill);
  box-shadow:var(--shadow-sm);
  transition:color .18s,border-color .18s,transform .18s var(--spring);
}
.header__back:active{transform:scale(.9)}
.header__back svg{width:19px;height:19px}
.header__logo{height:38px;margin-inline:auto}
.header__spacer{width:var(--tap);flex:0 0 var(--tap)}

/* ---------- Progresso --------------------------------------------------- */
.progress{margin-bottom:20px}
.progress__meta{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;font-weight:600;color:var(--faint);
  letter-spacing:.02em;margin-bottom:7px;
}
.progress__meta b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.progress__track{height:6px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.progress__bar{
  height:100%;width:0;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--accent),#34D399);
  transition:width .55s var(--ease);
}

/* ---------- Tipografia -------------------------------------------------- */
.title{
  font-size:var(--fs-title);font-weight:700;line-height:1.28;letter-spacing:-.015em;
  text-align:center;margin:0 0 6px;text-wrap:balance;
}
.title--lg{font-size:var(--fs-title-lg)}
.subtitle{font-size:var(--fs-sub);line-height:1.45;text-align:center;color:var(--muted);margin:0}
.hint{font-size:13px;line-height:1.5;text-align:center;color:var(--muted);margin:12px 0 0}
.accent{color:var(--accent)}
.accent-u{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:700}

/* ---------- Opções ------------------------------------------------------ */
.options{display:grid;gap:10px;margin-top:20px}
.options--1{grid-template-columns:1fr}
.options--2{grid-template-columns:1fr 1fr}

.option{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  min-height:var(--tap);padding:13px 15px;
  background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);
  transition:border-color .2s,background .2s,box-shadow .2s,transform .16s var(--spring);
  animation:optionIn .42s var(--ease) both;
}
@keyframes optionIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.option:active{transform:scale(.97)}
.option.is-selected{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 3px var(--accent-ring);
}

.option__emoji{
  font-size:25px;line-height:1;flex:0 0 44px;height:44px;
  display:grid;place-items:center;
  background:var(--bg);border-radius:12px;
  transition:background .2s;
}
.option.is-selected .option__emoji{background:#fff}
.option__thumb{width:72px;height:72px;flex:0 0 72px;border-radius:12px;object-fit:cover}
.option__body{min-width:0;flex:1}
.option__title{display:block;font-size:var(--fs-option);font-weight:600;line-height:1.3}
.option__sub{display:block;font-size:var(--fs-option-sub);line-height:1.35;color:var(--muted);margin-top:3px}

/* Marca de seleção */
.option__check{
  flex:0 0 22px;width:22px;height:22px;display:grid;place-items:center;
  border:1.5px solid var(--border-strong);border-radius:var(--r-pill);
  color:#fff;transition:background .2s,border-color .2s;
}
.option__check svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.option.is-selected .option__check{background:var(--accent);border-color:var(--accent)}
.option.is-selected .option__check svg{opacity:1;transform:none}

/* Múltipla escolha: a marca vira quadrada. O círculo lê como "escolha uma"
   e faria a pessoa parar na primeira opção. */
.options--multi .option__check{border-radius:7px}

/* Imagem no topo (grid de 2 colunas) */
.option--top{flex-direction:column;align-items:stretch;gap:9px;padding:9px 9px 13px;text-align:center}
.option--top .option__thumb{width:100%;height:auto;aspect-ratio:1;flex:none}
.option--top .option__check{position:absolute;top:15px;right:15px;background:rgba(255,255,255,.92)}

/* Só imagem (pergunta de gênero) */
.option--image{padding:7px;gap:0;flex-direction:column}
.option--image img{width:100%;border-radius:11px;transition:transform .3s var(--ease)}

/* ---------- Barra de ação fixa (zona do polegar) ------------------------ */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px calc(16px + var(--safe-r)) calc(12px + var(--safe-b)) calc(16px + var(--safe-l));
  background:rgba(246,249,248,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  animation:barIn .3s var(--ease) both;
}
.actionbar__inner{max-width:440px;margin-inline:auto}
.actionbar .cta{margin-top:0}
@keyframes barIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}

/* ---------- Botões ------------------------------------------------------ */
.cta{
  display:block;width:100%;min-height:54px;padding:16px 20px;margin-top:20px;
  background:var(--accent);color:#fff;
  font-size:clamp(15px,4.2vw,17px);font-weight:700;
  letter-spacing:.01em;text-align:center;text-decoration:none;
  border-radius:var(--r-btn);box-shadow:var(--shadow-cta);
  transition:background .2s,transform .16s var(--spring),box-shadow .2s;
  animation:ctaGlow 2.4s ease-in-out infinite;
}
.cta:active{transform:scale(.98)}
@keyframes ctaGlow{
  0%,100%{box-shadow:0 5px 14px rgba(18,183,106,.26)}
  50%    {box-shadow:0 6px 18px rgba(18,183,106,.38)}
}
.cta[disabled]{
  background:var(--border);color:var(--faint);
  animation:none;box-shadow:none;cursor:not-allowed;
}

/* `.checkout` (funil A) e `.checkout_b` (funil B) acompanham o `.cta` só nos
   links que vão para o checkout, e é de propósito que nenhuma das duas tem regra
   aqui: servem de alvo para ferramenta externa de rastreio, não de estilo.
   Desde 18/08/2026 as duas variantes têm DOIS botões cada — `.checkout` marca
   o par de A e `.checkout_b` o par de B. Continuam disjuntas: para o total,
   some os dois seletores. Não apague por parecerem mortas, e não pendure
   visual nelas — os botões de checkout têm de continuar idênticos aos outros.
   Ver renderOffer() no app.js. */

/* ---------- Cartões de escolha (etapa de projeção) ---------------------- */
/* Dois cartões com ícone, título e subtítulo. Ambos avançam — o "não" só tem
   peso visual menor. O de cima pulsa de leve para puxar o toque. */
.pick{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 15px;border-radius:var(--r-card);
  transition:transform .16s var(--spring),box-shadow .2s;
}
.pick + .pick{margin-top:9px}
.pick:active{transform:scale(.985)}
.pick__icon{
  flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;
  border-radius:var(--r-pill);
}
.pick__icon svg{width:20px;height:20px}
.pick__body{min-width:0;display:block}
.pick__title{display:block;font-size:15px;font-weight:700;line-height:1.25}
.pick__sub{display:block;font-size:12.5px;font-weight:500;line-height:1.3;margin-top:2px}

.pick--sim{
  background:linear-gradient(135deg,#1F5A43 0%,#2E6B50 100%);
  color:#fff;box-shadow:0 6px 18px rgba(31,90,67,.28);
  animation:pickPulse 1.9s var(--ease) infinite;
}
.pick--sim .pick__icon{background:rgba(255,255,255,.16);color:#fff}
.pick--sim .pick__sub{color:rgba(255,255,255,.72)}
.pick--sim:active{animation-play-state:paused}

.pick--nao{
  background:var(--track);color:var(--muted);
  border:1px solid var(--border);
}
.pick--nao .pick__icon{background:rgba(15,27,23,.07);color:var(--faint)}
.pick--nao .pick__title{font-weight:600}
.pick--nao .pick__sub{color:var(--faint)}

/* Pulso: escala + halo que se abre. A escala fica baixa de propósito — o
   cartão é largo, e acima de ~1.03 ele encosta na borda da barra fixa. */
@keyframes pickPulse{
  0%,100%{transform:scale(1);    box-shadow:0 6px 18px rgba(31,90,67,.28), 0 0 0 0 rgba(18,183,106,.42)}
  50%    {transform:scale(1.024);box-shadow:0 11px 26px rgba(31,90,67,.40), 0 0 0 11px rgba(18,183,106,0)}
}

/* ---------- Aviso de sucesso -------------------------------------------- */
.note{
  display:flex;align-items:center;gap:9px;
  padding:12px 14px;border-radius:var(--r-card);
  background:var(--accent-soft);color:var(--accent-dark);
  border:1px solid rgba(18,183,106,.22);
  font-size:var(--fs-sub);font-weight:600;margin-bottom:14px;
  animation:stepIn .45s var(--ease) both;
}
.note svg{width:18px;height:18px;flex:0 0 18px}

/* ---------- Medidas (peso / altura) ------------------------------------- */
.measure{margin-top:20px;text-align:center}
.units{
  display:inline-flex;padding:4px;
  background:var(--track);border-radius:var(--r-pill);
}
.units button{
  min-width:88px;min-height:44px;padding:10px 24px;
  border-radius:var(--r-pill);font-size:15px;font-weight:600;
  color:var(--muted);transition:background .22s var(--ease),color .22s,box-shadow .22s;
}
.units button.is-active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

.measure__value{
  display:flex;align-items:baseline;justify-content:center;gap:3px;
  margin:18px 0 2px;color:var(--muted);font-size:16px;font-weight:600;
}
.measure__value b{
  font-size:clamp(38px,11vw,48px);font-weight:700;color:var(--text);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;
}

/* Régua: área de arraste generosa para o dedo */
.ruler{
  position:relative;height:92px;overflow:hidden;margin-top:4px;
  cursor:grab;touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);
}
.ruler:active{cursor:grabbing}
.ruler__track{position:absolute;top:0;left:0;height:100%;will-change:transform}
.ruler__tick{position:absolute;top:20px;width:2px;background:var(--border-strong);border-radius:2px}
.ruler__tick--major{background:var(--faint)}
.ruler__label{
  position:absolute;bottom:6px;font-size:12px;font-weight:600;color:var(--faint);
  transform:translateX(-50%);white-space:nowrap;
}
.ruler__needle{
  position:absolute;left:50%;top:10px;height:52px;width:4px;
  background:var(--accent);border-radius:4px;transform:translateX(-50%);
  box-shadow:0 0 0 5px var(--accent-ring);
}
.measure__drag{font-size:12.5px;color:var(--faint);margin-top:2px}

/* ---------- Formulário -------------------------------------------------- */
.field{margin-top:20px}
.field input{
  width:100%;min-height:56px;padding:17px 18px;
  font-size:16px;                 /* 16px impede o iOS de dar zoom ao focar */
  font-family:inherit;font-weight:500;
  color:var(--text);background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder{color:var(--faint);font-weight:400}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}

/* ---------- Tela de análise --------------------------------------------- */
.loading{text-align:center;padding-top:14px}
.ring{position:relative;width:min(60vw,168px);aspect-ratio:1;margin:0 auto 24px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring__bg{stroke:var(--track)}
.ring__fg{stroke:var(--accent);transition:stroke-dashoffset .12s linear}
.ring__pct{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(30px,9vw,38px);font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.loading__title{font-size:var(--fs-title);font-weight:700;letter-spacing:-.015em;margin:0 0 8px}
.loading__sub{font-size:var(--fs-sub);line-height:1.5;color:var(--muted);max-width:340px;margin:0 auto}

.checks{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:9px;text-align:left}
.checks li{
  display:flex;align-items:center;gap:11px;
  padding:12px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-btn);
  font-size:var(--fs-sub);font-weight:500;color:var(--muted);
  opacity:.45;transition:opacity .35s,color .35s,border-color .35s;
}
.checks li.is-done{opacity:1;color:var(--text);border-color:rgba(18,183,106,.3)}
.checks__mark{
  flex:0 0 20px;width:20px;height:20px;display:grid;place-items:center;
  border:1.5px solid var(--border-strong);border-radius:var(--r-pill);
  color:#fff;transition:background .3s,border-color .3s;
}
.checks__mark svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s var(--spring)}
.checks li.is-done .checks__mark{background:var(--accent);border-color:var(--accent)}
.checks li.is-done .checks__mark svg{opacity:1;transform:none}

.carousel{
  position:relative;margin:0 auto 22px;width:min(78vw,300px);
  border-radius:var(--r-card);overflow:hidden;aspect-ratio:1;
  box-shadow:var(--shadow-md);
}
.carousel img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.05);
  transition:opacity .7s var(--ease),transform 4s linear;
}
.carousel img.is-active{opacity:1;transform:scale(1)}

/* ---------- Projeção: antes x depois + gráfico -------------------------- */
/* As figuras são recortes de corpo inteiro em 2:3, mesma pose e mesmo
   enquadramento — por isso `contain` e proporção casada: cortar pé ou cabeça
   destruiria a leitura do antes x depois. */
.ba{
  display:flex;align-items:flex-end;gap:6px;margin-top:9px;
  padding:6px 8px 0;
  background:linear-gradient(180deg,var(--surface),var(--accent-soft));
  border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-sm);
}
.ba__item{flex:1;margin:0;min-width:0}
.ba__frame{position:relative;aspect-ratio:5/7;overflow:hidden;border-radius:12px}
/* Só aparece se o arquivo faltar — a imagem cobre por cima. */
.ba__frame::after{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(160deg,var(--border),var(--track));
}
.ba__frame img{
  position:relative;z-index:1;
  width:100%;height:100%;object-fit:contain;display:block;
  /* As figuras vêm com fundo branco e nem todas têm a proporção da moldura.
     O branco no próprio <img> preenche a sobra do `contain`, senão apareceria
     o degradê de placeholder como faixa cinza ao lado da figura. */
  background:#fff;
  animation:stepIn .5s var(--ease) both;
}
.ba__item:last-child .ba__frame img{animation-delay:.18s}
.ba__label{
  margin:3px 0 7px;text-align:center;
  font-size:12.5px;font-weight:600;color:var(--muted);
}
.ba__item:last-child .ba__label{color:var(--accent)}
.ba__seta{flex:0 0 auto;align-self:center;color:var(--faint);font-size:18px}

.chart{
  margin-top:8px;padding:2px 2px 0;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);box-shadow:var(--shadow-sm);
}
.chart svg{display:block;width:100%;height:auto}

/* O traço e o fill vêm como atributo no próprio <path>. Se o CSS falhar, o
   gráfico ainda desenha certo em vez de virar um vulto preto. */
.chart__line{stroke-dasharray:1;stroke-dashoffset:1;animation:chartDraw 1.2s var(--ease) forwards}
.chart__line--sem{animation-duration:.9s}
.chart__line--com{animation-delay:.25s}
.chart__area{animation:chartFade .9s .7s var(--ease) both}

.chart__ytick,.chart__eixo{font-size:10px;font-weight:600;fill:var(--faint)}
.chart__ytick{font-size:10.5px;font-weight:700;fill:var(--muted);font-variant-numeric:tabular-nums}
/* "kg" acompanha o número sem competir com ele */
.chart__yunit{font-size:8.5px;font-weight:600;fill:var(--faint)}

/* Cores dos pontos e pílulas vêm como atributo no próprio elemento.
   Aqui fica só o tempo de entrada. */
.chart__halo{opacity:0;animation:haloIn .5s 1.25s forwards}
.chart__halo.chart__dot--ini{animation-delay:.35s}
.chart__halo.chart__dot--sem{animation-delay:1.1s}
.chart__dot{opacity:0;animation:chartFade .35s 1.25s forwards}
.chart__dot--ini{animation-delay:.35s}
.chart__dot--sem{animation-delay:1.1s}

.chart__pill text{letter-spacing:.01em}
.chart__pill--sem{animation:chartFade .4s .9s both}
.chart__pill--com{animation:chartFade .4s 1.3s both}

.chart__nota{
  font-size:11px;line-height:1.4;text-align:center;
  color:var(--faint);margin:7px 0 0;
}
@keyframes chartDraw{to{stroke-dashoffset:0}}
@keyframes chartFade{from{opacity:0}to{opacity:1}}
@keyframes haloIn{to{opacity:.18}}

/* ---------- VSL / oferta ------------------------------------------------ */
.vsl{margin:0 0 14px;border-radius:var(--r-card);overflow:hidden}
.vsl vturb-smartplayer{display:block;width:100%;margin-inline:auto}
.reveal{animation:stepIn .5s var(--ease) both}
.offer-img{border-radius:var(--r-card);margin:14px 0;box-shadow:var(--shadow-md)}

/* Oferta com dois preços (variante B do teste). Cada cartão traz o seu botão
   no lugar da barra fixa, então o respiro entre os blocos é o que separa uma
   oferta da outra — sem isso o segundo preço parece continuação do primeiro. */
.oferta + .oferta{margin-top:34px}
.oferta .cta{margin-top:2px}
/* Sem barra fixa nesta variante, o #app perde o padding-bottom do .has-bar e o
   último botão encosta no fim da rolagem. O safe-area já vem do #app. */
.oferta:last-child{padding-bottom:18px}

/* ---------- Cascata das opções ------------------------------------------ */
.options .option:nth-child(1){animation-delay:.04s}
.options .option:nth-child(2){animation-delay:.09s}
.options .option:nth-child(3){animation-delay:.14s}
.options .option:nth-child(4){animation-delay:.19s}
.options .option:nth-child(5){animation-delay:.24s}
.options .option:nth-child(6){animation-delay:.29s}

/* =========================================================================
   Estados de :hover só onde existe mouse de verdade.
   Em touch, o :hover "gruda" depois do toque e o card fica preso no
   estado de destaque — por isso ficam isolados aqui.
   ========================================================================= */
@media (hover:hover) and (pointer:fine){
  .header__back:hover{color:var(--text);border-color:var(--border-strong)}
  .option:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
  .option--image:hover img{transform:scale(1.04)}
  .cta:hover{background:var(--accent-dark)}
  .cta[disabled]:hover{background:var(--border)}
}

/* ---------- Telas bem estreitas (iPhone SE e similares) ----------------- */
@media (max-width:359px){
  #app{padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r))}
  .options{gap:8px}
  .option{padding:11px 12px;gap:10px}
  .option__thumb{width:60px;height:60px;flex-basis:60px}
  .option__emoji{flex-basis:40px;height:40px;font-size:22px}
  .checks li{padding:10px 12px}
  .ba{gap:6px}
  .ba__seta{font-size:16px}
}

/* ---------- Telas baixas: a etapa de projeção precisa caber inteira ------
   Dois cartões de escolha ocupam ~180px de barra fixa. Em aparelho curto
   (SE, S8+), encolhe figura, gráfico e cartões em vez de empurrar o
   conteúdo para fora da tela. */
@media (max-height:820px){
  .ba{margin-top:7px;padding:5px 6px 0}
  .ba__frame{aspect-ratio:1/1}
  .ba__label{font-size:11.5px;margin:2px 0 5px}
  .chart{margin-top:6px}
  .chart svg{max-height:150px;margin-inline:auto}
  .chart__nota{font-size:10.5px;margin-top:5px}
  .pick{padding:9px 13px}
  .pick + .pick{margin-top:7px}
  .pick__icon{flex:0 0 36px;width:36px;height:36px}
  .pick__icon svg{width:17px;height:17px}
  .pick__title{font-size:14px}
  .pick__sub{font-size:11.5px}
}
@media (max-height:700px){
  .ba__frame{aspect-ratio:6/5}
  .chart svg{max-height:124px}
  .title{font-size:18px;margin-bottom:4px}
  .subtitle{font-size:12.5px}
}

/* ---------- Celular deitado: encurta as áreas altas --------------------- */
@media (orientation:landscape) and (max-height:520px){
  .ring{width:min(30vw,120px);margin-bottom:16px}
  .ruler{height:74px}
  .carousel{width:min(34vw,190px)}
  .loading{padding-top:6px}
  .ba{max-width:340px;margin-inline:auto}
  .chart{max-width:420px;margin-inline:auto}
}

/* ---------- Acessibilidade ---------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}

</style>

/* ------------------------------------------------------- Barra de ação --- */
/* O botão principal fica fixo na base, dentro do alcance do polegar.
   Mora fora de #app porque a animação de entrada da etapa usa transform,
   e um ancestral transformado quebraria o position:fixed. */

function setActionBar(html) {
  if (!html) {
    bar.hidden = true;
    bar.innerHTML = '';
    document.body.classList.remove('has-bar');
    return null;
  }
  bar.innerHTML = `<div class="actionbar__inner">${html}</div>`;
  bar.hidden = false;
  document.body.classList.add('has-bar');

  /* A barra nem sempre tem a mesma altura: a etapa de projeção leva dois
     botões, e o primário quebra em duas linhas. Medir aqui evita que a barra
     cubra o fim do conteúdo — o --bar-h fixo de 88px só servia para um botão. */
  requestAnimationFrame(() => {
    document.body.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  });

  return bar.firstElementChild.firstElementChild;
}

/* Quando o teclado do celular abre, ele cobriria a barra fixa.
   O visualViewport encolhe, então subimos a barra na mesma medida. */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const syncBar = () => {
    const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    bar.style.transform = hidden ? `translateY(${-hidden}px)` : '';
  };
  vv.addEventListener('resize', syncBar);
  vv.addEventListener('scroll', syncBar);
}

const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','src','sck'];

const utms = (() => {
  const q = new URLSearchParams(location.search);
  const out = {};
  for (const k of UTM_KEYS) { const v = q.get(k); if (v) out[k] = v; }
  return out;
})();

/* ------------------------------------------------------- Analítica própria */
/* O funil manda um beacon para /api/lead a cada etapa. É o que alimenta o
   dashboard de retenção — a UTMify só registra pageview e conversão, então
   sem isto o abandono por etapa fica invisível.

   Nada aqui pode travar o funil: sendBeacon não bloqueia, não espera resposta
   e todo acesso a storage está protegido (navegação privada antiga lança).   */

const LEAD = (() => {
  const ID_KEY = 'mchia_sid';

  /* A CHAVE DA VARIANTE É VERSIONADA POR TESTE, e isso não é capricho.

     Ao encerrar o teste #1, todo visitante teve `mchia_variant = 'A'` gravado,
     de propósito, para tirar de B quem estava vendo a oferta perdedora. Se o
     sorteio do teste #2 lesse a mesma chave, TODO recorrente ficaria preso em
     A: o split viraria "novatos 50/50, recorrentes 100% A", e nada no painel
     denunciaria isso — só um B misteriosamente menor.

     Chave nova = sorteio novo para todo mundo, mantendo a estabilidade dentro
     do teste. AO ABRIR O PRÓXIMO TESTE, SUBA ESTE NÚMERO. */
  const AB_KEY = 'mchia_ab_t4';

  const ler = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignora */ } };

  /* localStorage e não sessionStorage: o lead precisa continuar o mesmo se
     fechar a aba e voltar, senão uma pessoa vira dois no relatório. */
  let sid = ler(ID_KEY);
  if (!sid) {
    sid = (crypto.randomUUID?.() || String(Date.now()) + Math.random().toString(16).slice(2));
    gravar(ID_KEY, sid);
  }

  /* A variante continua sendo preservada para atribuição dos checkouts e das
     vendas. A ordem das perguntas, porém, é única para todos os visitantes. */
  let variant = ler(AB_KEY);

  /* ?ab=A ou ?ab=B força a variante e fixa a escolha, para conferir as duas
     telas no ar sem depender do sorteio. Só a QA usa — anúncio nenhum manda
     esse parâmetro, então não desequilibra o teste. */
  const forcada = new URLSearchParams(location.search).get('ab');
  if (forcada === 'A' || forcada === 'B') variant = forcada;

  if (variant !== 'A' && variant !== 'B') variant = Math.random() < 0.5 ? 'A' : 'B';
  gravar(AB_KEY, variant);

  /* Eventos já disparados nesta sessão. Vão acumulados em todo beacon: o
     sendBeacon não tem retentativa, então um clique enviado uma vez só se
     perderia de vez se aquele envio falhasse. Reenviar é inofensivo. */
  const flags = {};

  const envia = (step) => {
    const corpo = JSON.stringify({
      session_id: sid,
      step,
      variant,
      respostas: state.answers,
      flags,
      utm: utms,
      referrer: document.referrer || null,
    });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/lead', new Blob([corpo], { type: 'application/json' }));
      } else {
        fetch('/api/lead', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: corpo, keepalive: true,
        }).catch(() => {});
      }
    } catch { /* analítica nunca derruba o funil */ }
  };

  return {
    sid, variant,
    etapa: (id) => envia(id),
    evento(nome) { flags[nome] = true; envia(nome); },
  };
})();

/* ----------------------------------------------- Ordem canônica do quiz --- */
/* A mesma ordem é usada por todas as variantes para que o funil sempre abra
   na primeira pergunta e a retenção permaneça coerente. */
const ORDEM_CANONICA = FUNNEL.map(s => s.id).join(',');

/* ------------------------------------------------------------------ Jornada */
/* Complementa a analítica do lado do cliente: guarda os tempos de cada etapa
   para o perfil que viaja na URL do checkout.
   Fica em sessionStorage para sobreviver a um reload sem misturar sessões. */

const journey = (() => {
  const KEY = 'mchia_journey';
  let list = [];
  try { list = JSON.parse(sessionStorage.getItem(KEY)) || []; } catch { /* modo privado */ }

  const save = () => {
    try { sessionStorage.setItem(KEY, JSON.stringify(list)); } catch { /* idem */ }
  };

  /** Segundos entre a entrada numa etapa e a entrada na seguinte. */
  const secondsOn = (id) => {
    const i = list.findIndex(e => e.id === id);
    if (i < 0) return 0;
    const fim = list[i + 1]?.t ?? Date.now();
    return Math.round((fim - list[i].t) / 1000);
  };

  return {
    enter(id) {
      if (list[list.length - 1]?.id === id) return;   // re-render da mesma etapa
      list.push({ id, t: Date.now() });
      save();
    },
    /** Marca na etapa atual que o conteúdo pós-vídeo apareceu. */
    revealed() {
      const last = list[list.length - 1];
      if (last) { last.rv = 1; save(); }
    },
    secondsOn,
    all: () => list.map(e => ({ ...e, segundos: secondsOn(e.id) })),
    total: () => (list.length ? Math.round((Date.now() - list[0].t) / 1000) : 0),
  };
})();

/** Perfil compacto do lead, anexado à URL do checkout. */
function journeyParams() {
  return {
    qz_meta:  answer('meta-peso'),
    qz_idade: answer('idade'),
    qz_corpo: answer('tipo-corpo'),
    qz_area:  answer('area-gordura'),
    qz_imc:   imc(),
    qz_vsl1:  journey.secondsOn('vsl-1'),
    qz_t:     journey.total(),
  };
}

/* `base` é obrigatório: cada cartão de oferta tem o seu link
   (CONFIG.ofertasA / CONFIG.ofertasB). O perfil do lead vai igual em todos.
   Esquecer a base lança TypeError na hora — melhor que mandar tráfego para
   um link morto em silêncio. */
function checkoutUrl(base) {
  const url = new URL(base);
  for (const [k, v] of Object.entries(utms)) url.searchParams.set(k, v);
  if (state.nome) url.searchParams.set('name', state.nome);
  for (const [k, v] of Object.entries(journeyParams())) {
    if (v !== '' && v != null) url.searchParams.set(k, v);
  }
  return url.toString();
}

   O pixel da UTMify (carregado no <head> do index.html) rastreia sozinho, e

   Medição de etapa é com LEAD.evento(), que vai para /api/lead e para o

/* ------------------------------------------------------------------ Helpers */

/* ------------------------------------------------------- Personalização --- */
/* As respostas das primeiras etapas alimentam tokens {{assim}}, resolvidos em
   qualquer texto do FUNNEL. A ordem importa: a meta de peso existe desde a
   etapa 1, mas peso e altura só a partir da etapa 8 — todo token derivado de
   medida precisa de um fallback, senão a VSL 1 renderiza vazio. */

/* Ponto médio de cada faixa da etapa 1, em kg. */
const META_KG = {
  'Até 5Kg':       5,
  '6 a 10 Kg':    10,
  '11 a 15 Kg':   15,
  '16 a 20 Kg':   20,
  'Mais de 20 Kg': 25,
};

/* Perda semanal usada na projeção. Conservadora de propósito: gera prazos que
   o protocolo consegue sustentar. */
const KG_POR_SEMANA = 0.75;

/* Fração da meta que o gráfico da etapa "projecao" mostra em 30 dias.
   Em 1 o gráfico entrega a meta inteira no primeiro mês — é o resultado que a
   pessoa declarou esperar, sem suavizar. É parâmetro de copy, não fisiológico:
   o ritmo real seria o KG_POR_SEMANA acima, ~3 kg no mês (fator ~0.25). */
const FATOR_30D = 1;

/* Etapa de múltipla escolha guarda array; as demais, string. Estes dois
   normalizam a diferença para quem só quer ler a resposta. */
const comoLista = (v) => (Array.isArray(v) ? [...v] : v ? [v] : []);

const answer = (id) => comoLista(state.answers[id]).join(', ');

/* "abdômen e flancos", não "abdômen, flancos": o token {{area}} cai no meio de
   frases, e a vírgula solta antes do fim soa truncada. */
function listaNatural(itens) {
  if (itens.length < 2) return itens[0] || '';
  return itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1];
}

/** Quilos a perder. Usa a diferença real quando as medidas já foram dadas;
    antes disso, cai para a faixa escolhida na etapa 1. */
function deltaKg() {
  const atual = state.answers['peso-atual'];
  const alvo  = state.answers['peso-objetivo'];
  if (atual && alvo && atual > alvo) return Math.round(atual - alvo);
  return META_KG[answer('meta-peso')] || 10;
}

/** IMC, ou string vazia enquanto peso e altura não foram informados. */
function imc() {
  const peso = state.answers['peso-atual'];
  const alt  = state.answers['altura'];
  if (!peso || !alt) return '';
  return (peso / ((alt / 100) ** 2)).toFixed(1).replace('.', ',');
}

/* A faixa etária crua ("55+", "45 a 54") não cabe no meio de uma frase.
   Este mapa dá a forma que se lê bem. */
const FAIXA = {
  'Menos de 25': 'com menos de 25 anos',
  '25 a 34':     'entre 25 e 34 anos',
  '35 a 44':     'entre 35 e 44 anos',
  '45 a 54':     'entre 45 e 54 anos',
  '55+':         'com mais de 55 anos',
};

const semanas = () => Math.max(2, Math.ceil(deltaKg() / KG_POR_SEMANA));

/** Quilos que o gráfico de 30 dias exibe. Nunca passa da meta declarada. */
const perda30 = () => Math.min(deltaKg(), Math.max(1, Math.round(deltaKg() * FATOR_30D)));

/** Peso no fim dos 30 dias. Sem peso informado, não há número a mostrar. */
function peso30() {
  const atual = state.answers['peso-atual'];
  return atual ? atual - perda30() : 0;
}

function dataAlvo() {
  const d = new Date();
  d.setDate(d.getDate() + semanas() * 7);
  return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
}

/* Primeiro nome, capitalizado — o campo costuma vir com nome completo,
   espaços sobrando ou tudo em caixa alta. */
function primeiroNome() {
  const n = (state.nome || '').trim().split(/\s+/)[0] || '';
  return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : '';
}

const TOKENS = {
  nome:       () => primeiroNome(),
  meta:       () => answer('meta-peso'),
  metaKg:     () => META_KG[answer('meta-peso')] || '',
  delta:      () => deltaKg(),
  pesoAtual:  () => state.answers['peso-atual']    || '—',
  objetivo:   () => state.answers['peso-objetivo'] || '—',
  altura:     () => state.answers['altura']        || '—',
  // Na tela nunca fica vazio: sem medidas, mostra um travessão em vez de um
  // buraco na frase. Já no checkout o parâmetro é simplesmente omitido.
  imc:        () => imc() || '—',
  idade:      () => answer('idade'),
  faixa:      () => FAIXA[answer('idade')] || '',
  area:       () => listaNatural(comoLista(state.answers['area-gordura'])).toLowerCase(),
  corpo:      () => (answer('tipo-corpo') || '').toLowerCase(),
  barreira:   () => (answer('barreira') || '').toLowerCase(),
  prazo:      () => semanas(),
  dataAlvo:   () => dataAlvo(),
  perda30:    () => perda30(),
  peso30:     () => peso30() || '—',
};

const interpolate = (s) => (s || '').replace(
  /\{\{(\w+)\}\}/g,
  (raw, key) => (TOKENS[key] ? TOKENS[key]() : raw),
);

/* Resolve um campo com variantes por resposta. `campoBy` pode ser indexado
   por gênero (f/m, o caso original) ou por qualquer resposta já dada:

     titleBy: { f: '...', m: '...' }
     hintBy:  { by: 'meta-peso', 'Até 5Kg': '...', default: '...' }                */
function resolveBy(map, fallback) {
  if (!map) return fallback;
  if (!map.by) return map[state.genero] ?? fallback;
  return map[state.answers[map.by]] ?? map.default ?? fallback;
}

/** Opções/título da etapa, já resolvidos para o perfil atual. */
const optionsOf = (s) => resolveBy(s.optionsBy, s.options || []);
const titleOf   = (s) => interpolate(resolveBy(s.titleBy, s.title || ''));
const hintOf    = (s) => interpolate(resolveBy(s.hintBy, s.hint || ''));
const subOf     = (s) => interpolate(resolveBy(s.subtitleBy, s.subtitle || ''));

/* --------------------------------------------------- Blocos reutilizáveis */

function renderHeader(step) {
  const canGoBack = state.step > 0;
  return `
    <div class="header">
      ${canGoBack
        ? `<button class="header__back" type="button" data-back aria-label="Voltar">${ICON_BACK}</button>`
        : `<span class="header__spacer"></span>`}
      <img class="header__logo" src="${IMG}logo-tema.webp" alt="Mounjaro de Chia" width="40" height="40">
      <span class="header__spacer"></span>
    </div>`;
}

/** Barra de progresso com contador "X de N". */
function renderProgress(step) {
  const i = NUMBERED.indexOf(step.id);
  if (i < 0) return '';
  const pct = ((i + 1) / NUMBERED.length) * 100;
  return `
    <div class="progress" data-pct="${pct}">
      <div class="progress__meta">
        <span>Etapa ${i + 1} de ${NUMBERED.length}</span>
        <b data-progress-num>0%</b>
      </div>
      <div class="progress__track"><div class="progress__bar" data-progress></div></div>
    </div>`;
}

/** Anima a barra e faz o número subir contando. */
function animateProgress() {
  const wrap = shell.querySelector('[data-pct]');
  if (!wrap) return;
  const target = +wrap.dataset.pct;
  const bar = wrap.querySelector('[data-progress]');
  const num = wrap.querySelector('[data-progress-num]');

  requestAnimationFrame(() => { bar.style.width = target + '%'; });

  const started = performance.now();
  const dur = 550;
  (function tick(now) {
    const t = Math.min(1, (now - started) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    num.textContent = Math.round(target * eased) + '%';
    if (t < 1) requestAnimationFrame(tick);
  })(started);
}

/* ------------------------------------------------------------ Renderizadores */

function renderQuiz(s) {
  const opts = optionsOf(s);
  const layout = s.layout;

  /* O que já estava respondido. Serve para remarcar as opções ao voltar uma
     etapa — antes a resposta continuava gravada mas a tela vinha limpa. */
  const escolhidas = comoLista(state.answers[s.id]);

  const optionHTML = (o, i) => {
    const marcada = escolhidas.includes(o.title) ? ' is-selected' : '';
    if (layout === 'image') {
      return `<button class="option option--image${marcada}" type="button" data-pick="${i}" aria-label="${o.title}">
                <img src="${IMG}${o.image}" alt="${o.title}" width="400" height="400">
              </button>`;
    }
    const media = layout === 'emoji'
      ? `<span class="option__emoji">${o.emoji}</span>`
      : `<img class="option__thumb" src="${IMG}${o.image}" alt="" width="150" height="150">`;
    const cls = layout === 'thumb-top' ? 'option option--top' : 'option';
    return `
      <button class="${cls}${marcada}" type="button" data-pick="${i}">
        ${media}
        <span class="option__body">
          <span class="option__title">${o.title}</span>
          ${o.subtitle ? `<span class="option__sub">${o.subtitle}</span>` : ''}
        </span>
        <span class="option__check">${ICON_CHECK}</span>
      </button>`;
  };

  shell.innerHTML = `
    ${renderHeader(s)}
    ${renderProgress(s)}
    <h1 class="title">${titleOf(s)}</h1>
    ${subOf(s) ? `<p class="subtitle">${subOf(s)}</p>` : ''}
    <div class="options options--${s.cols}${s.multi ? ' options--multi' : ''}">${opts.map(optionHTML).join('')}</div>`;

  animateProgress();

  /* Múltipla escolha: a barra só existe a partir da primeira marcação, e some
     de novo se a pessoa desmarcar tudo. */
  const sincronizaBarra = () => {
    const n = comoLista(state.answers[s.id]).length;
    setActionBar(n ? `<button class="cta" type="button" data-next>${s.cta || 'CONTINUAR'}</button>` : null);
    for (const b of bar.querySelectorAll('[data-next]')) b.addEventListener('click', next);
  };
  if (s.multi) sincronizaBarra();

  shell.querySelectorAll('[data-pick]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const opt = opts[+btn.dataset.pick];

      if (s.multi) {
        const marcadas = comoLista(state.answers[s.id]);
        const i = marcadas.indexOf(opt.title);
        if (i >= 0) marcadas.splice(i, 1); else marcadas.push(opt.title);
        btn.classList.toggle('is-selected', i < 0);
        state.answers[s.id] = marcadas;
        sincronizaBarra();
        return;
      }

      shell.querySelectorAll('.option').forEach(o => o.classList.remove('is-selected'));
      btn.classList.add('is-selected');
      state.answers[s.id] = opt.title;
      if (s.id === 'genero') state.genero = opt.value;
      // Pausa curta para a marca de seleção aparecer antes de avançar
      setTimeout(next, 260);
    });
  });
}

function renderMeasure(s) {
  const unitKind = s.kind;                       // 'weight' | 'height'
  const alt = unitKind === 'weight' ? 'lb' : 'pol';
  const base = unitKind === 'weight' ? 'kg' : 'cm';
  let value = state.answers[s.id] ?? s.initial;  // sempre na unidade base

  shell.innerHTML = `
    ${renderHeader(s)}
    ${renderProgress(s)}
    <h1 class="title">${titleOf(s)}</h1>
    <div class="measure">
      <div class="units">
        <button type="button" data-unit="${base}">${base}</button>
        <button type="button" data-unit="${alt}">${alt}</button>
      </div>
      <p class="measure__value"><b data-value></b><span data-unit-label></span></p>
      <div class="ruler" data-ruler>
        <div class="ruler__track" data-track></div>
        <div class="ruler__needle"></div>
      </div>
      <p class="measure__drag">${s.drag}</p>
      <p class="hint">${hintOf(s)}</p>
    </div>`;

  setActionBar(`<button class="cta" type="button" data-next>${s.cta}</button>`);
  animateProgress();

  /* Grava já o valor exibido. Sem isto, quem toca em CONTINUAR sem arrastar a
     régua não deixa resposta nenhuma — e é um quarto dos leads. */
  state.answers[s.id] = value;

  const ruler   = shell.querySelector('[data-ruler]');
  const track   = shell.querySelector('[data-track]');
  const valueEl = shell.querySelector('[data-value]');
  const unitEl  = shell.querySelector('[data-unit-label]');
  const PX = 12; // pixels por unidade base

  const ticks = [];
  for (let v = s.min; v <= s.max; v++) {
    const major = v % 10 === 0;
    ticks.push(`<span class="ruler__tick${major ? ' ruler__tick--major' : ''}"
                      style="left:${(v - s.min) * PX}px;height:${major ? 30 : 15}px"></span>`);
    if (major) ticks.push(`<span class="ruler__label" style="left:${(v - s.min) * PX}px">${v}</span>`);
  }
  track.innerHTML = ticks.join('');
  track.style.width = ((s.max - s.min) * PX) + 'px';

  const toDisplay = (v) =>
    state.units[unitKind] === base ? v
      : unitKind === 'weight' ? Math.round(v * 2.20462)
      : Math.round(v / 2.54);

  function paint() {
    const offset = (ruler.offsetWidth / 2) - ((value - s.min) * PX);
    track.style.transform = `translateX(${offset}px)`;
    valueEl.textContent = toDisplay(value);
    unitEl.textContent = state.units[unitKind];
  }

  function setValue(v) {
    value = Math.min(s.max, Math.max(s.min, Math.round(v)));
    state.answers[s.id] = value;
    paint();
  }

  // Arraste (mouse + toque, via Pointer Events)
  let dragging = false, startX = 0, startValue = 0;
  ruler.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; startValue = value;
    ruler.setPointerCapture(e.pointerId);
  });
  ruler.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    setValue(startValue - (e.clientX - startX) / PX);
  });
  const stop = () => { dragging = false; };
  ruler.addEventListener('pointerup', stop);
  ruler.addEventListener('pointercancel', stop);

  shell.querySelectorAll('[data-unit]').forEach((btn) => {
    btn.classList.toggle('is-active', btn.dataset.unit === state.units[unitKind]);
    btn.addEventListener('click', () => {
      state.units[unitKind] = btn.dataset.unit;
      shell.querySelectorAll('[data-unit]').forEach(b =>
        b.classList.toggle('is-active', b.dataset.unit === state.units[unitKind]));
      paint();
    });
  });

  setValue(value);
  requestAnimationFrame(paint);   // a régua precisa da largura já calculada
}

function renderForm(s) {
  shell.innerHTML = `
    ${renderHeader(s)}
    ${renderProgress(s)}
    <h1 class="title">${titleOf(s)}</h1>
    <p class="subtitle">${subOf(s)}</p>
    <div class="field">
      <input type="text" data-input placeholder="${s.placeholder}"
             autocomplete="given-name" enterkeyhint="go" maxlength="40">

  input.addEventListener('input', sync);

  btn.addEventListener('click', () => {

function renderLoading(s) {
  const R = 74;
  const C = 2 * Math.PI * R;

  shell.innerHTML = `
    <div class="loading">
      ${s.carousel ? `<div class="carousel">${s.carousel.map((img, i) =>
        `<img src="${IMG}${img}" alt="" class="${i === 0 ? 'is-active' : ''}"
              width="300" height="300" loading="${i === 0 ? 'eager' : 'lazy'}">`).join('')}</div>` : `
      <div class="ring">
        <svg viewBox="0 0 168 168" aria-hidden="true">
          <circle class="ring__bg" cx="84" cy="84" r="${R}"></circle>
          <circle class="ring__fg" cx="84" cy="84" r="${R}"
                  stroke-dasharray="${C}" stroke-dashoffset="${C}" data-ring></circle>
        </svg>
        <div class="ring__pct" data-pct>0%</div>
      </div>`}
      <h1 class="loading__title">${titleOf(s)}</h1>
      <p class="loading__sub">${subOf(s)}</p>
      ${s.checks ? `<ul class="checks">${s.checks.map(c =>
        `<li><span class="checks__mark">${ICON_CHECK}</span>${interpolate(c)}</li>`).join('')}</ul>` : ''}
    </div>`;

  const ring  = shell.querySelector('[data-ring]');
  const pctEl = shell.querySelector('[data-pct]');
  const items = [...shell.querySelectorAll('.checks li')];
  const total = s.seconds * 1000;
  const started = performance.now();

  // Carrossel de imagens
  let carouselTimer;
  if (s.carousel) {
    const imgs = [...shell.querySelectorAll('.carousel img')];
    let i = 0;
    carouselTimer = setInterval(() => {
      imgs[i].classList.remove('is-active');
      i = (i + 1) % imgs.length;
      imgs[i].classList.add('is-active');
    }, total / imgs.length);
  }

  function tick(now) {
    const p = Math.min(100, ((now - started) / total) * 100);
    if (ring)  ring.style.strokeDashoffset = C * (1 - p / 100);
    if (pctEl) pctEl.textContent = Math.round(p) + '%';
    // Marca cada checagem conforme a barra passa pelo trecho dela
    items.forEach((li, i) => {
      if (p >= ((i + 1) / items.length) * 92) li.classList.add('is-done');
    });
    if (p < 100) {
      requestAnimationFrame(tick);
    } else {
      clearInterval(carouselTimer);
      next();
    }
  }
  requestAnimationFrame(tick);
}

/** Injeta o player VTurb apenas quando a etapa é aberta. */
function mountPlayer(container, key) {
  const { player } = CONFIG[key];

  // VSL 1 e VSL Final usam Wistia Aurora.
  if (key === 'vsl1' || key === 'vslFinal' || key === 'vslFinalB') {
    container.innerHTML = `
      <style>
        wistia-player[media-id="${player}"]:not(:defined) {
          background: center / contain no-repeat url('https://fast.wistia.com/embed/medias/${player}/swatch');
          display: block;
          filter: blur(5px);
          padding-top: 178.06%;
        }
      </style>
      <wistia-player media-id="${player}" aspect="0.5616224648985959"></wistia-player>`;

    if (!document.querySelector('script[data-wistia-player]')) {
      const base = document.createElement('script');
      base.src = 'https://fast.wistia.com/player.js';
      base.async = true;
      base.dataset.wistiaPlayer = '1';
      document.head.appendChild(base);
    }

    if (!document.querySelector(`script[data-wistia-media="${player}"]`)) {
      const media = document.createElement('script');
      media.src = `https://fast.wistia.com/embed/${player}.js`;
      media.async = true;
      media.type = 'module';
      media.dataset.wistiaMedia = player;
      document.head.appendChild(media);
    }
    return;
  }

  // Mantém o comportamento original para qualquer outro player.
  container.innerHTML =
    `<vturb-smartplayer id="vid-${player}" style="display:block;margin:0 auto;width:100%;max-width:400px"></vturb-smartplayer>`;
  const el = document.createElement('script');
  el.src = `https://scripts.converteai.net/${CONFIG.converteAccount}/players/${player}/v4/player.js`;
  el.async = true;
  document.head.appendChild(el);
}

/**
 * MONTA os elementos abaixo do vídeo quando a REPRODUÇÃO chega no segundo
 * pedido — não quando passa esse tempo na tela. Pausar o vídeo pausa a
 * contagem, igual ao funil original.
 *
 * ANTI-UNFUNNELIZER — dois reforços, nesta ordem de importância:
 *
 * 1. O conteúdo não existe no DOM antes da hora. A versão anterior montava
 *    tudo escondido (n.hidden = true) e só alternava o atributo; ferramenta
 *    de destravar funil (Unfunnelizer e afins) varre a página, remove
 *    hidden/display:none de tudo — e a oferta aparecia inteira, com link de
 *    checkout. Por isso aqui se recebe um mount(), não uma lista de nós:
 *    antes do reveal não há o que revelar.
 *
 * 2. Piso de relógio. O gatilho é o onTime do player, e essas ferramentas
 *    também aceleram o vídeo (playbackRate 16x) ou gravam progresso falso no
 *    localStorage do smartplayer para o onTime disparar cedo. Numa reprodução
 *    honesta o vídeo não chega aos N segundos antes de N segundos de relógio,
 *    então o reveal também exige 95% disso em tempo real desde a entrada na
 *    etapa. ATENÇÃO: isso assume que o player NÃO usa "continuar de onde
 *    parou" — com retomada ligada no painel da ConverteAI, quem voltasse no
 *    meio do vídeo esperaria o piso inteiro de novo.
 *
 * Se o player não subir (bloqueador de anúncios, script fora do ar), cai num
 * cronômetro comum para o funil não ficar sem saída.
 */
const PISO_RELOGIO = 0.95; // fração de revealAt exigida em tempo real; 0 desliga

let revealNow = null; // mount pendente da etapa atual; __funnel.reveal() usa

/* --------------------------------------------------------------- CHAVE SECRETA */
/* 4 cliques rápidos na tela liberam a VSL atual para testes.
   Funciona tanto na VSL 1 quanto na VSL Final, sem criar botão visível. */
let secretClickCount = 0;
let secretLastClick = 0;
let secretResetTimer = null;

function initSecretVslSkip() {
  document.addEventListener('click', () => {
    const agora = Date.now();

    // Reinicia se os cliques não forem rápidos o suficiente.
    if (agora - secretLastClick > 1000) secretClickCount = 0;

    secretLastClick = agora;
    secretClickCount++;

    clearTimeout(secretResetTimer);
    secretResetTimer = setTimeout(() => {
      secretClickCount = 0;
    }, 1000);

    if (secretClickCount >= 4) {
      secretClickCount = 0;
      clearTimeout(secretResetTimer);

      // revealNow só existe enquanto uma VSL está aguardando o tempo de liberação.
      if (typeof revealNow === 'function') {
        console.log('🔐 Chave secreta ativada — VSL liberada');
        revealNow();
      }
    }
  }, { passive: true });
}

initSecretVslSkip();

function revealAtVideoTime(container, seconds, mount) {
  let done = false;
  const t0 = performance.now();
  const etapa = state.step;

  const show = () => {
    // A checagem de etapa mata o cronômetro de segurança de uma etapa
    // abandonada: sem ela, voltar no histórico deixaria um mount() órfão
    // armado contra o shell da etapa errada.
    if (done || state.step !== etapa) return;
    done = true;
    revealNow = null;
    journey.revealed();
    mount();
  };

  // Segura o onTime do player até o piso de relógio ser cumprido.
  const gate = () => {
    if (done) return;
    const falta = seconds * 1000 * PISO_RELOGIO - (performance.now() - t0);
    if (falta > 0) setTimeout(show, falta); else show();
  };

  revealNow = show;

  // reveal=0 no preview: não há o que esperar, mostra de imediato.
  if (seconds <= 0) { show(); return show; }

  // Wistia Aurora: acompanha o tempo real do vídeo.
  if (container.querySelector('wistia-player')) {
    let tries = 0;
    const bindWistia = setInterval(() => {
      if (done || state.step !== etapa) {
        clearInterval(bindWistia);
        return;
      }
      const player = container.querySelector('wistia-player');
      const current =
        typeof player?.currentTime === 'number' ? player.currentTime :
        typeof player?.getCurrentTime === 'function' ? player.getCurrentTime() : NaN;

      if (Number.isFinite(current)) {
        if (current >= seconds) {
          clearInterval(bindWistia);
          gate();
        }
      } else if (++tries > 100) {
        // Segurança caso a API de tempo ainda não esteja disponível.
        clearInterval(bindWistia);
        setTimeout(gate, seconds * 1000);
      }
    }, 250);
    return show;
  }

  // VTurb: comportamento original para outros players.
  let tries = 0;
  const bind = setInterval(() => {
    const player = container.querySelector('vturb-smartplayer');
    if (typeof player?.onTime === 'function') {
      clearInterval(bind);
      player.onTime(seconds, gate, { once: true });
    } else if (++tries > 40) {
      clearInterval(bind);
      setTimeout(show, seconds * 1000);
    }
  }, 200);

  return show;                            // usado pelo modo de preview
}

function renderVsl(s) {
  shell.innerHTML = `
    <div class="vsl" data-player></div>
    <p class="hint">${hintOf(s)}</p>`;

  const player = shell.querySelector('[data-player]');
  mountPlayer(player, s.video);

  /* A barra inteira só passa a EXISTIR quando o vídeo chega no ponto certo
     (ver revealAtVideoTime). Montada depois do render(), fica fora do bind
     global de [data-next] — por isso o next é ligado à mão aqui. */
  revealAtVideoTime(player, CONFIG[s.video].revealAt, () => {
    setActionBar(`<button class="cta" type="button" data-next>${s.cta}</button>`);
    bar.classList.add('reveal');
    const btn = bar.querySelector('[data-next]');
    btn?.addEventListener('click', () => LEAD.evento('cta_vsl1'));
    btn?.addEventListener('click', next);
  });
}

/* ------------------------------------------------------------- Projeção --- */

/* --------------------------------------------------------------- Gráfico ---
   SVG inline, sem biblioteca — mesmo caminho do anel da tela de análise.
   Duas curvas: a da pessoa com o método (gradiente vermelho→verde, caindo
   forte) e a de referência sem ele (cinza, quase plana). O contraste entre
   as duas é o que a tela vende.                                            */

/* Quanto a linha cinza cai em 30 dias. Proporcional, para o gráfico não
   ficar estranho em metas pequenas. */
const perdaSemMetodo = () => Math.max(0.5, perda30() * 0.12);

/* Pontos de uma curva de queda. `curvatura` > 1 faz cair mais rápido no
   começo e suavizar no fim. */
function curvaPeso(perdaTotal, curvatura) {
  const inicio = state.answers['peso-atual'] || 0;
  const passos = 16;
  return Array.from({ length: passos + 1 }, (_, i) => {
    const t = i / passos;
    return { t, peso: inicio - perdaTotal * (1 - Math.pow(1 - t, curvatura)) };
  });
}

function graficoHTML() {
  const vb = { w: 340, h: 174, L: 54, R: 14, T: 28, B: 28 };
  const plotW = vb.w - vb.L - vb.R;
  const plotH = vb.h - vb.T - vb.B;

  const temPeso = !!state.answers['peso-atual'];
  const topo  = state.answers['peso-atual'] || 0;   // peso de hoje = topo do eixo
  const chao  = peso30() || 0;                      // peso projetado = base
  const faixa = Math.max(1, topo - chao);

  const X = (t) => vb.L + t * plotW;
  const Y = (peso) => vb.T + ((topo - peso) / faixa) * plotH;

  const via   = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.peso).toFixed(1)}`).join(' ');
  const comMetodo  = curvaPeso(perda30(), 2.2);
  const semMetodo  = curvaPeso(perdaSemMetodo(), 1.3);
  const dCom = via(comMetodo);
  const dSem = via(semMetodo);
  const fimCom = comMetodo[comMetodo.length - 1];
  const fimSem = semMetodo[semMetodo.length - 1];

  /* Casas decimais só quando a faixa é curta demais para inteiros distintos. */
  const casas = faixa >= 3 ? 0 : 1;
  const rotulo = (v) => v.toFixed(casas).replace('.', ',');

  const marcas = [0, 1, 2, 3].map(i => {
    const peso = topo - (i / 3) * faixa;
    return { y: vb.T + (i / 3) * plotH, peso };
  });

  /* Pílula de rótulo: largura estimada pelo texto, sem medir o DOM.
     Cores vão como atributo além da classe — se o CSS não chegar, a pílula
     ainda sai na cor certa em vez de um retângulo preto. */
  const pilula = (texto, cx, cy, classe, cor) => {
    const w = texto.length * 5.4 + 18;
    return `
      <g class="chart__pill ${classe}">
        <rect x="${(cx - w / 2).toFixed(1)}" y="${(cy - 9).toFixed(1)}"
              width="${w.toFixed(1)}" height="18" rx="9" fill="${cor}"/>
        <text x="${cx.toFixed(1)}" y="${(cy + 3.6).toFixed(1)}" text-anchor="middle"
              fill="#fff" font-size="9.5" font-weight="700">${texto}</text>
      </g>`;
  };

  const ponto = (x, y, classe, cor) => `
    <circle class="chart__halo ${classe}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9"
            fill="${cor}" opacity=".18"/>
    <circle class="chart__dot ${classe}"  cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"
            fill="${cor}" stroke="#fff" stroke-width="2.5"/>`;

  return `
    <div class="chart">
      <svg viewBox="0 0 ${vb.w} ${vb.h}" role="img"
           aria-label="Projeção de peso em 30 dias, com e sem o método">
        <defs>
          <linearGradient id="gTraco" gradientUnits="userSpaceOnUse"
                          x1="${vb.L}" y1="0" x2="${vb.L + plotW}" y2="0">
            <stop offset="0%"   stop-color="var(--danger)"/>
            <stop offset="45%"  stop-color="var(--warn)"/>
            <stop offset="100%" stop-color="var(--accent)"/>
          </linearGradient>
          <linearGradient id="gArea" gradientUnits="userSpaceOnUse"
                          x1="0" y1="${vb.T}" x2="0" y2="${vb.T + plotH}">
            <stop offset="0%"   stop-color="var(--warn)"   stop-opacity=".22"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>

        ${marcas.map(m => `
          <line class="chart__grid" x1="${vb.L}" y1="${m.y.toFixed(1)}"
                x2="${vb.L + plotW}" y2="${m.y.toFixed(1)}"
                stroke="#E4EAE7" stroke-dasharray="2 4"/>
          ${temPeso ? `<text class="chart__ytick" x="${vb.L - 9}" y="${(m.y + 3.4).toFixed(1)}"
                text-anchor="end">${rotulo(m.peso)}<tspan class="chart__yunit"> kg</tspan></text>` : ''}`).join('')}

        <path class="chart__area" d="${dCom} L${X(1).toFixed(1)} ${(vb.T + plotH).toFixed(1)} L${X(0).toFixed(1)} ${(vb.T + plotH).toFixed(1)} Z"
              fill="url(#gArea)" stroke="none"/>

        <path class="chart__line chart__line--sem" d="${dSem}"
              pathLength="1" fill="none" stroke="#C4CFCA" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>

        <path class="chart__line chart__line--com" d="${dCom}"
              pathLength="1" fill="none" stroke="url(#gTraco)" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round"/>

        ${ponto(X(0), Y(topo), 'chart__dot--ini', '#F04438')}
        ${ponto(X(1), Y(fimSem.peso), 'chart__dot--sem', '#C4CFCA')}
        ${ponto(X(1), Y(fimCom.peso), 'chart__dot--com', '#12B76A')}

        ${pilula('Sem o método', X(0.38), Y(semMetodo[6].peso) - 15, 'chart__pill--sem', '#9AA8A3')}
        ${/* No vão entre as duas curvas: é o único espaço garantidamente livre,
              qualquer que seja a meta da pessoa. */''}
        ${pilula('Com o Mounjaro de Chia', X(0.70),
                 (Y(semMetodo[11].peso) + Y(comMetodo[11].peso)) / 2, 'chart__pill--com', '#12B76A')}

        ${['Hoje', '15 dias', '30 dias'].map((r, i) => `
          <text class="chart__eixo" x="${X(i / 2).toFixed(1)}" y="${vb.h - 9}"
                text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${r}</text>`).join('')}
      </svg>
    </div>`;
}

function renderProjection(s) {
  const img = resolveBy(s.imagesBy, s.images || { antes: '', depois: '' });

  /* onerror esconde a <img> e deixa só o fundo neutro da moldura: enquanto
     os arquivos não estiverem em assets/img/, a tela continua apresentável. */
  const foto = (arquivo, rotulo) => `
    <figure class="ba__item">
      <div class="ba__frame">
        ${arquivo ? `<img src="${IMG}${arquivo}" alt="" loading="eager"
             onerror="this.remove()">` : ''}
      </div>
      <figcaption class="ba__label">${rotulo}</figcaption>
    </figure>`;

  shell.innerHTML = `
    ${renderHeader(s)}
    <h1 class="title">${titleOf(s)}</h1>
    <p class="subtitle">${subOf(s)}</p>
    <div class="ba">
      ${foto(img.antes, s.antesLabel)}
      <div class="ba__seta" aria-hidden="true">→</div>
      ${foto(img.depois, s.depoisLabel)}
    </div>
    ${graficoHTML()}
    ${s.nota ? `<p class="chart__nota">${interpolate(s.nota)}</p>` : ''}`;

  /* Os dois avançam: o "não" é só um sim de menor peso visual. O render()
     liga [data-next] em tudo que estiver no shell e na barra, então não
     existe listener novo aqui. */
  /* Os dois avançam: o "não" é só um sim de menor peso visual. O render()
     liga [data-next] em tudo que estiver no shell e na barra, então não
     existe listener novo aqui. */
  const cartao = (icone, titulo, sub, classe) => `
    <button class="pick ${classe}" type="button" data-next>
      <span class="pick__icon">${icone}</span>
      <span class="pick__body">
        <span class="pick__title">${interpolate(titulo)}</span>
        ${sub ? `<span class="pick__sub">${interpolate(sub)}</span>` : ''}
      </span>
    </button>`;

  setActionBar(
    cartao(ICON_LEAF, s.cta, s.ctaSub, 'pick--sim') +
    cartao(ICON_X, s.ctaAlt, s.ctaAltSub, 'pick--nao'));

  /* Os dois avançam igual, mas o dashboard precisa distinguir quem afirmou de
     quem hesitou — é o que dá sentido ao micro-compromisso da tela. */
  bar.querySelector('.pick--sim')?.addEventListener('click', () => LEAD.evento('cta_projecao'));
  bar.querySelector('.pick--nao')?.addEventListener('click', () => LEAD.evento('cta_projecao_alt'));
}

/** Chave do vídeo da etapa, já resolvendo o teste A/B da oferta. */
function videoDaEtapa(s) {
  return s.type === 'offer' && LEAD.variant === 'B' ? 'vslFinalB' : s.video;
}

function renderOffer(s) {
  /* Desde o fim do teste #2 (18/08/2026, B campeã) as duas variantes mostram
     o MESMO layout: dois cartões, cada um com seu botão e seu link. A barra
     fixa saiu de cena — com duas ofertas, um botão fixo escolheria pela
     pessoa que ainda está comparando. O que muda por variante é a lista de
     ofertas e a classe de rastreio. */
  const ofertas = LEAD.variant === 'B' ? CONFIG.ofertasB : CONFIG.ofertasA;
  const classeCheckout = LEAD.variant === 'B' ? 'checkout_b' : 'checkout';
  const video  = videoDaEtapa(s);

  /* A oferta NÃO entra no innerHTML inicial: título, cartões e links de
     checkout só são criados dentro do mount() do reveal. Antes disso o DOM
     tem só um slot vazio — ferramenta que desesconde elemento não acha nada
     (ver revealAtVideoTime). */
  shell.innerHTML = `
    <div class="note">${ICON_CHECK}${s.note}</div>
    <h1 class="title title--lg">${titleOf(s)}</h1>
    <p class="subtitle" style="margin-bottom:16px">${subOf(s)}</p>
    <div class="vsl" data-player></div>
    <div data-oferta></div>`;

  const player = shell.querySelector('[data-player]');
  mountPlayer(player, video);

  revealAtVideoTime(player, CONFIG[video].revealAt, () => {
    /* Nenhuma das duas classes estiliza: quem desenha o botão é o `cta`. Elas
       existem para ferramenta externa de rastreio mirar sem pegar os CONTINUAR
       do quiz, que também são `.cta`.

       `checkout` marca os DOIS botões do funil A e `checkout_b` os do B —
       disjuntas de propósito, a pedido. Consequência: `.checkout` NÃO cobre
       os dois lados; para o total, some os dois seletores. Dentro do funil,
       quem identifica é o data-checkout, logo abaixo. */
    const ofertasHTML = ofertas.map(o => `
        <div class="oferta reveal">
          <img class="offer-img" src="${IMG}${o.image}" alt="${o.alt}"
               width="600" height="901" loading="lazy">
          <a class="cta ${classeCheckout}" data-checkout="${o.evento}" href="${checkoutUrl(o.checkout)}"
             rel="noopener">${o.cta}</a>
        </div>`).join('');

    shell.querySelector('[data-oferta]').innerHTML = `
      <h2 class="title reveal">${interpolate(s.title2)}</h2>
      ${ofertasHTML}`;

    /* checkout_click continua sendo o total, em A e em B: é a métrica que
       compara as duas variantes. Desde 18/08/2026 os eventos por plano também
       saem das duas — durante o teste #2 eram exclusivos de B.

       Nenhum evento de pixel sai daqui: o InitiateCheckout é a UTMify que
       manda, sozinha, ao ver o clique no link — o listener dela é global no
       documento, então alcança links montados depois. Ver o bloco "Pixel". */
    for (const el of document.querySelectorAll('[data-checkout]')) {
      el.addEventListener('click', () => {
        if (el.dataset.checkout !== 'checkout_click') LEAD.evento(el.dataset.checkout);
        LEAD.evento('checkout_click');
      });
    }
  });
}

/* ------------------------------------------------------------------ Router */

const RENDERERS = {
  quiz: renderQuiz,
  measure: renderMeasure,
  form: renderForm,
  loading: renderLoading,
  vsl: renderVsl,
  projection: renderProjection,
  offer: renderOffer,
};

/** Pré-carrega as imagens da próxima etapa, para a navegação parecer instantânea. */
function preloadNext(index) {
  const s = FUNNEL[index];
  if (!s) return;
  const srcs = [];
  /* Na oferta, as duas variantes mostram os dois cartões de plano. */
  if (s.type === 'offer') {
    const ofertas = LEAD.variant === 'B' ? CONFIG.ofertasB : CONFIG.ofertasA;
    srcs.push(...ofertas.map(o => o.image));
  } else if (s.image) srcs.push(s.image);
  if (s.carousel) srcs.push(...s.carousel);
  if (s.images || s.imagesBy) {
    srcs.push(...Object.values(resolveBy(s.imagesBy, s.images || {})));
  }
  for (const o of optionsOf(s) || []) {
    if (o.image) srcs.push(o.image);
  }
  for (const src of srcs) { const i = new Image(); i.src = IMG + src; }
}

function render() {
  const s = FUNNEL[state.step];
  if (!s) return;

  setActionBar(null);          // cada etapa monta a sua, se precisar
  journey.enter(s.id);
  LEAD.etapa(s.id);
  RENDERERS[s.type](s);

  // Dispara a animação de entrada da etapa
  shell.classList.remove('step-in');
  void shell.offsetWidth;
  shell.classList.add('step-in');

  window.scrollTo(0, 0);

  for (const root of [shell, bar]) {
    root.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', back));
    root.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', next));
  }

  preloadNext(state.step + 1);
}

function go(index, push = true) {
  state.step = Math.min(FUNNEL.length - 1, Math.max(0, index));
  if (push) history.pushState({ step: state.step }, '', '#/' + FUNNEL[state.step].id);
  render();
}

const next = () => go(state.step + 1);
const back = () => history.back();

window.addEventListener('popstate', (e) => {
  const step = e.state?.step;
  // Etapas de carregamento não devem ser revisitadas ao voltar
  if (typeof step === 'number') {
    state.step = FUNNEL[step]?.type === 'loading' ? Math.max(0, step - 1) : step;
    render();
  }
});

/* ------------------------------------------------- Preview (?debug=1) ----- */
/* Permite revisar qualquer etapa sem refazer o quiz. Fica desligado no
   tráfego real — só liga com ?debug=1 na URL.
   Uso no console:  __funnel.go('oferta')  ·  __funnel.steps()
   Uso por link:    ?debug=1&reveal=0&step=oferta                          */

/* Respostas de exemplo do preview. Saltar direto para uma etapa deixa o state
   vazio, e a copy com token viraria "Analisamos suas respostas, !" — sem isto
   não dá para revisar o visual de nada que venha depois do quiz.
   Perfil: mulher, 35-44, quer perder 14 kg (82 → 68). */
const RESPOSTAS_EXEMPLO = {
  'meta-peso':     '11 a 15 Kg',
  'genero':        'Mulher',
  'idade':         '35 a 44',
  'tipo-corpo':    'Sobrepeso',
  'area-gordura':  ['Abdômen', 'Flancos'],
  'peso-atual':    82,
  'altura':        165,
  'peso-objetivo': 68,
};

function preencheExemplo() {
  Object.assign(state.answers, RESPOSTAS_EXEMPLO);
  state.genero = 'f';
  state.nome   = 'Ana';
  return RESPOSTAS_EXEMPLO;
}

/* Token do preview em produção. Troque à vontade; quem não o tiver não liga o
   modo debug fora do localhost. Ele fica no fonte, então barra o curioso com
   a URL decorada — não quem lê o JS. Blindar contra leitura de fonte exigiria
   servir a oferta pelo backend (ver conversa sobre o Unfunnelizer). */
const DEBUG_TOKEN = 'chia-rev-0826';

function initDebug() {
  const q = new URLSearchParams(location.search);
  if (!q.has('debug')) return;

  /* ?debug=1&reveal=0&step=oferta era uma porta pública: qualquer etapa, com
     reveal zerado, para quem soubesse o parâmetro — sem precisar de ferramenta
     nenhuma. Em produção o preview agora exige ?debug=<token>; no localhost o
     ?debug=1 de sempre continua valendo. */
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!local && q.get('debug') !== DEBUG_TOKEN) return;

  /* No preview o CTA não fica esperando 760s de vídeo: o reveal cai para
     poucos segundos, ou some de vez com &reveal=0. Mexe só na cópia em
     memória do CONFIG — os valores de produção no topo do arquivo continuam
     760/260 e não dependem disto. */
  const reveal = q.has('reveal') ? Math.max(0, +q.get('reveal') || 0) : 3;
  CONFIG.vsl1.revealAt = reveal;
  CONFIG.vslFinal.revealAt = reveal;
  CONFIG.vslFinalB.revealAt = reveal;

  window.__funnel = {
    state,
    config: CONFIG,
    steps: () => FUNNEL.map((s, i) => `${i}. ${s.id} (${s.type})`),
    go(idOrIndex) {
      const i = typeof idOrIndex === 'number'
        ? idOrIndex
        : FUNNEL.findIndex(s => s.id === idOrIndex);
      if (i < 0) return 'etapa não encontrada';
      go(i);
      return FUNNEL[i].id;
    },
    setGenero(g) { state.genero = g; return g; },
    /** Preenche o quiz com o perfil de exemplo e redesenha a etapa atual. */
    preencher() { const r = preencheExemplo(); render(); return r; },
    /** Jornada da sessão e o que iria para a URL do checkout. */
    journey: () => ({ etapas: journey.all(), params: journeyParams(),
      url: checkoutUrl((LEAD.variant === 'B' ? CONFIG.ofertasB : CONFIG.ofertasA)[0].checkout) }),
    /** Identidade do lead na analítica. */
    lead: () => ({ session_id: LEAD.sid, variante: LEAD.variant }),
    setNome(n) { state.nome = n; return n; },
    /** Monta na hora o que está esperando o tempo de vídeo. */
    reveal() {
      if (!revealNow) return 'nada aguardando reveal nesta etapa';
      revealNow();   // pula o onTime e o piso de relógio
      return 'ok';
    },
    /** Pula a reprodução para N segundos antes do reveal. */
    seek(secondsBefore = 5) {
      const p = shell.querySelector('vturb-smartplayer');
      const s = FUNNEL[state.step];
      if (!p || !s.video) return 'não é uma etapa de vídeo';
      const alvo = Math.max(0, CONFIG[videoDaEtapa(s)].revealAt - secondsBefore);
      p.seek(alvo);
      return `pulou para ${alvo}s`;
    },
  };
  console.log(`[funil] preview ativo — reveal das VSLs em ${reveal}s `
    + '(use &reveal=0 para instantâneo). __funnel.steps() lista as etapas.');
  console.log(`[funil] variante ${LEAD.variant} — troque com ?ab=A ou ?ab=B na URL.`);

  /* &step=oferta abre direto naquela etapa, já com o quiz preenchido — é o que
     permite revisar uma tela por link, sem passar pelo console. Só mexe no
     state; o render() do fim do arquivo é quem desenha. */
  const alvo = q.get('step');
  if (alvo) {
    const i = /^\d+$/.test(alvo) ? +alvo : FUNNEL.findIndex(s => s.id === alvo);
    if (i >= 0 && i < FUNNEL.length) {
      preencheExemplo();
      state.step = i;
      console.log(`[funil] abrindo direto em "${FUNNEL[i].id}", com respostas de exemplo.`);
    } else {
      console.warn(`[funil] etapa "${alvo}" não existe — __funnel.steps() lista as válidas.`);
    }
  }

  /* lib/steps.js repete a ordem das etapas para a função serverless calcular
     o progresso. Se as duas divergirem, a retenção do dashboard passa a
     mentir sem nenhum sinal — então o preview confere e avisa.

     /api/stats passou a exigir senha, então esta checagem só roda depois de
     você abrir o /stats.html e autenticar (o navegador reaproveita a
     credencial na mesma origem). O 401 é tratado à parte de propósito: cair
     no catch mudo faria a conferência sumir sem avisar, que é exatamente o
     silêncio que ela existe para evitar. */
  fetch('/api/stats')
    .then((r) => {
      if (r.status === 401 || r.status === 503) {
        console.info('[funil] conferência FUNNEL × lib/steps.js pulada: /api/stats '
          + 'pede senha. Abra /stats.html, autentique e recarregue esta página.');
        return null;
      }
      return r.json();
    })
    .then((d) => {
      if (!d) return;
      const servidor = (d.steps || []).map(s => s.key).join(',');
      /* Compara a ordem CANÔNICA, não a da tela: na variante B as duas
         primeiras etapas trocam de lugar de propósito (teste #4). */
      const local    = ORDEM_CANONICA;
      if (servidor && servidor !== local) {
        console.warn('[funil] lib/steps.js está fora de sincronia com o FUNNEL.\n'
          + '  app.js      : ' + local + '\n'
          + '  lib/steps.js: ' + servidor);
      }
    })
    .catch(() => { /* sem backend rodando: normal no http.server */ });
}

/* ------------------------------------------------------------------ Início */

initDebug();
/* state.step é 0 no tráfego normal; só o preview com &step= o move antes daqui. */
history.replaceState({ step: state.step }, '', '#/' + FUNNEL[state.step].id);
render();

</script>
<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app && app.querySelector('.boot')) {
    app.innerHTML = '<main class="shell" style="padding:30px 16px;text-align:center"><h1 style="font-family:Poppins,Arial,sans-serif">Não foi possível carregar a página</h1><p style="font-family:Poppins,Arial,sans-serif">Verifique se todos os arquivos do projeto foram enviados para a mesma pasta.</p></main>';
  }
}, true);
</script>
